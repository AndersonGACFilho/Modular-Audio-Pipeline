[project]
name = "videotranscripter"
version = "2.0.0"
description = "Audio processing and transcription pipeline with local jobs"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "accelerate>=0.30.0,<0.31.0",
    "ctranslate2>=4,<5",
    "demucs>=4.0.0",
    "faster-whisper==1.2.1",
    "huggingface-hub~=0.32.0",
    "instructor>=1.0.0",
    "lightning>=2.4.0,<2.5.0",
    "noisereduce~=3.0.3",
    "numpy>=1.26,<1.27",
    "openai>=1.0.0",
    "openai-whisper>=20250625",
    "pika>=1.3.2,<2",
    "pydantic>=2.0.0",
    "pydub~=0.25.1",
    "pyloudnorm~=0.1.1",
    "pymongo>=4.10,<5",
    "pyannote.audio>=3.1,<3.2",
    "python-dotenv>=1.1,<1.2",
    "soundfile~=0.13.1",
    "torch==2.5.1+cu121",
    "torchaudio==2.5.1+cu121",
    "torchmetrics>=1.6.0,<1.7.0",
    "torchvision==0.20.1+cu121",
    "transformers>=4.40.0,<4.41.0",
    "typing-extensions>=4.12.2",
    "webrtcvad-wheels~=2.0.14",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu121" }]
torchvision = [{ index = "pytorch-cu121" }]
torchaudio = [{ index = "pytorch-cu121" }]
